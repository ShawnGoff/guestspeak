# Railway builds this service with Nixpacks, which gives a Node image and
# nothing else. `pg_dump` is not in it, so the nightly backup would have failed
# on its first run with "pg_dump: not found" — at 3am, into a log nobody reads.
#
# postgresql_17 for the client tools. pg_dump is forward compatible but not
# backward: a newer client can dump an older server, while an older client
# refuses a newer one with "server version mismatch". Supabase moves its
# Postgres version without asking, so the client is pinned ahead of it rather
# than level with it.
[phases.setup]
nixPkgs = ['...', 'postgresql_17']
